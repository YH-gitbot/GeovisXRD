[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"


[project]
name = "geovisxrd"
version = "0.2.1"
description = "GeoVisXRD: An Open-Source Python Library for Geospatial Shapley Value Computation and Visualization"


readme = "README.md" 


authors = [
  { name = "Yuanhan Shu", email = "yuanhan.shu@tum.de" },
]


license = { text = "MIT" }


classifiers = [
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 2.7",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.7",
]

# 依赖项 (关键！见下文说明)
# 你必须手动将 requirements.txt 文件的内容复制到这里
dependencies = [
    "numpy",
    "pandas",
    "tqdm",
    "scipy",
    "shap",
    "joblib",
    "xgboost<3.0.0",
    "scikit-learn",
    "lightgbm",
    "matplotlib",

    "statsmodels"
]

# Python 版本要求
requires-python = ">=3.8"


